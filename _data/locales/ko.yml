about_page:
  title: "소개"
  intro: "게임의 입력부터 전투와 진행까지, 플레이 규칙을 코드로 구현합니다."
  sections:
    - title: "어떤 개발자인가"
      paragraphs:
        - "Unity·C#으로 플레이어 행동, 전투 판정, 장비와 성장, 적 AI, UI와 게임 진행을 구현했습니다. 개인 프로젝트에서는 C++·SFML로 이동, 충돌, 카메라와 레벨 로딩을 직접 구성했습니다."
        - "기능이 동작하는 것에서 멈추지 않고 경계 조건과 상태 전환을 살피는 데 관심이 있습니다. 대시 중 덮어써지던 이동 속도, 여러 Collider를 가진 대상의 중복 피해, 연타로 과열을 피할 수 있던 규칙의 허점처럼 직접 플레이하며 찾은 문제를 원인부터 고쳤습니다."
    - title: "팀에서 맡은 역할"
      paragraphs:
        - "팀 프로젝트에서는 게임플레이 구현 외에 공통 UI·입력·오디오를 연결하고, PM으로 기능 분담과 통합을 맡은 경험이 있습니다. 각 프로젝트 페이지에는 직접 맡은 범위와 팀원과 함께 만든 부분을 구분해 적었습니다."
    - title: "학력과 교육"
      paragraphs:
        - "한경국립대학교 소프트웨어융합전공 학사 졸업예정(2027년 2월)입니다. 수원농생명과학고등학교를 2019년 1월 졸업했습니다."
        - "더조은컴퓨터아카데미에서 C·C++ 프로그래밍(2023년), 파이썬 프로그래밍(2023년), 데이터 리터러시 및 머신러닝 관련 과정(2024년), 정보처리기사 실기 과정(2026년)을 수강했습니다. 정보처리기사는 2026년 12월 취득 예정입니다."
    - title: "이 사이트를 읽는 방법"
      paragraphs:
        - "첫 화면은 이력서 요약입니다. 프로젝트 페이지에서는 구현 배경과 선택한 방법, 코드 근거를 확인할 수 있습니다. 회사별 자기소개서는 별도 지원 서류로 작성합니다."

